<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10213a"><link rel="manifest" href="manifest.webmanifest"><title>분자생물학 페이지 해설</title><style>
:root{--navy:#10213a;--blue:#1d4ed8;--ink:#172033;--muted:#65738a;--line:#dbe3ee;--bg:#f3f6fb;--card:#fff;--pale:#eaf1ff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--navy);color:white;padding:18px 16px 16px;position:sticky;top:0;z-index:4}header h1{font-size:20px;margin:0 0 6px}header p{font-size:12px;color:#c7d4e7;margin:0}.tabs{display:flex;gap:8px;margin-top:14px}.tab{border:1px solid #64748b;background:transparent;color:white;border-radius:999px;padding:9px 13px;font-weight:700}.tab.active{background:white;color:var(--navy)}main{max-width:1200px;margin:auto;padding:14px}.toolbar{display:grid;gap:9px;margin-bottom:12px}.toolbar select,.toolbar input{width:100%;border:1px solid var(--line);border-radius:12px;background:white;padding:11px;font-size:14px;color:var(--ink)}.layout{display:grid;gap:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.panelhead{padding:13px 14px;border-bottom:1px solid var(--line);font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:center}.pdfwrap{background:#e5eaf2;padding:8px}.pdf{display:block;width:100%;height:52vh;min-height:330px;border:0;background:white;border-radius:8px}.pagecontrols{display:flex;align-items:center;gap:8px;padding:10px}.pagecontrols button,.action{border:1px solid var(--line);border-radius:10px;background:white;padding:9px 12px;font-weight:700;color:var(--ink)}.pagecontrols .count{flex:1;text-align:center;font-size:13px;font-weight:700}.content{padding:14px}.deckname{font-size:12px;color:var(--muted);margin-bottom:5px}.title{font-size:19px;font-weight:850;line-height:1.3;margin:0 0 12px}.section{border-top:1px solid var(--line);padding:13px 0}.section h3{font-size:14px;margin:0 0 9px}.section p{font-size:14px;line-height:1.65;margin:6px 0}.term{padding:10px 0;border-bottom:1px solid #edf0f5}.term:last-child{border:0}.term b{display:block;font-size:14px;color:#173e86;margin-bottom:4px}.term span{font-size:13px;line-height:1.55;display:block}.relation{background:#fff7e6;border:1px solid #f5d58c;border-radius:11px;padding:11px;margin:8px 0;font-size:13px;line-height:1.6}.slideText{white-space:pre-wrap;font-size:12px;line-height:1.55;color:#526074;max-height:200px;overflow:auto;background:#f7f9fc;border-radius:10px;padding:10px}.topiclist{display:flex;gap:7px;flex-wrap:wrap;padding:12px}.topic{border:1px solid var(--line);border-radius:999px;background:white;padding:8px 10px;font-size:12px}.topic.active{background:var(--pale);border-color:#91b4ff;color:#153e9b;font-weight:800}.topicresults{padding:0 12px 12px}.topicresults button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:white;padding:11px 2px;font-size:13px;color:var(--ink)}.hint{font-size:12px;color:var(--muted);line-height:1.5;padding:0 14px 14px}.badge{font-size:11px;background:#eaf1ff;color:#214da6;border-radius:6px;padding:4px 7px}.empty{padding:15px;color:var(--muted);font-size:13px}@media(min-width:900px){main{padding:20px}.toolbar{grid-template-columns:1fr 1fr 1.4fr}.layout{grid-template-columns:minmax(0,1.2fr) minmax(380px,.8fr);align-items:start}.pdf{height:75vh;min-height:600px}.right{position:sticky;top:160px;max-height:calc(100vh - 175px);overflow:auto}}@media(max-width:899px){.right{display:flex;flex-direction:column}.slideText{max-height:150px}}
</style></head><body><header><h1>분자생물학 · 페이지별 해설 노트</h1><p>원본 슬라이드를 그대로 보면서 용어와 인과관계를 옆에서 확인하세요.</p><div class="tabs"><button class="tab active" data-group="RNA">RNA</button><button class="tab" data-group="Protein">Protein</button><button class="tab" data-group="All">전체</button></div></header><main><div class="toolbar"><select id="deck"></select><select id="topicFilter"><option value="all">모든 단원</option></select><input id="search" placeholder="용어·슬라이드 내용 검색"></div><div class="layout"><section class="panel"><div class="panelhead"><span id="pdfTitle">원본 강의 슬라이드</span><span class="badge" id="pageBadge"></span></div><div class="pdfwrap"><iframe class="pdf" id="pdf" title="원본 PDF 슬라이드"></iframe></div><div class="pagecontrols"><button id="prev">← 이전</button><span class="count" id="counter"></span><button id="next">다음 →</button></div><p class="hint">원본 PDF를 페이지 단위로 표시합니다. 브라우저가 PDF 미리보기를 지원하지 않으면 PDF 파일을 별도로 열어 확인하세요.</p></section><div class="right"><section class="panel"><div class="panelhead"><span>이 페이지 해설</span><span class="badge" id="topicBadge"></span></div><div class="content"><div class="deckname" id="deckname"></div><h2 class="title" id="slideTitle"></h2><div class="section"><h3>핵심 이해</h3><p id="explanation"></p></div><div class="section"><h3>용어 해설</h3><div id="terms"></div></div><div class="section"><h3>인과관계·연결 포인트</h3><div id="relations"></div></div><div class="section"><h3>슬라이드에서 추출한 텍스트</h3><div class="slideText" id="slideText"></div></div></div></section><section class="panel" style="margin-top:12px"><div class="panelhead">단원별 바로가기</div><div class="topiclist" id="topicList"></div><div class="topicresults" id="topicResults"></div></section></div></div></main><script src="study-data.js"></script><script>
const D=window.STUDY_DATA;let group='RNA',deckId=1,page=1,topic='all',query='';const $=id=>document.getElementById(id);const topicMap=Object.fromEntries(D.topics.map(t=>[t.id,t]));function currentDeck(){return D.decks.find(d=>d.id===deckId)}function slidesForDeck(){return D.slides.filter(s=>s.deck===deckId)}function currentSlide(){return slidesForDeck().find(s=>s.page===page)||slidesForDeck()[0]}function filteredSlides(){return D.slides.filter(s=>(group==='All'||s.group===group)&&(deckId==='all'||s.deck===deckId)&&(topic==='all'||s.topic===topic)&&(!query||(`${s.text} ${s.deckTitle} ${s.page} ${s.topic}`.toLowerCase().includes(query.toLowerCase()))))}
function fillDecks(){let sel=$('deck');sel.innerHTML='';D.decks.filter(d=>group==='All'||d.group===group).forEach(d=>{let o=document.createElement('option');o.value=d.id;o.textContent=d.title;sel.appendChild(o)});if(deckId!=='all'&&!D.decks.some(d=>d.id===deckId&&(group==='All'||d.group===group)))deckId=D.decks.find(d=>group==='All'||d.group===group)?.id||1;sel.value=deckId}
function fillTopics(){let sel=$('topicFilter');sel.innerHTML='<option value="all">모든 단원</option>';D.topics.filter(t=>group==='All'||t.group===group).forEach(t=>{let o=document.createElement('option');o.value=t.id;o.textContent=t.name;sel.appendChild(o)});if(topic!=='all'&&!D.topics.some(t=>t.id===topic&&(group==='All'||t.group===group)))topic='all';sel.value=topic;let box=$('topicList');box.innerHTML='';D.topics.filter(t=>group==='All'||t.group===group).forEach(t=>{let b=document.createElement('button');b.className='topic'+(topic===t.id?' active':'');b.textContent=t.name;b.onclick=()=>{topic=t.id;$('topicFilter').value=topic;page=1;render();};box.appendChild(b)})}
function renderTopicResults(){let arr=filteredSlides().slice(0,20),box=$('topicResults');box.innerHTML='';if(!arr.length){box.innerHTML='<div class="empty">조건에 맞는 슬라이드가 없습니다.</div>';return}arr.forEach(s=>{let b=document.createElement('button');b.textContent=`${s.deckTitle} · ${s.page}/${s.total}페이지 — ${(s.text||'텍스트 추출 적음').replace(/\s+/g,' ').slice(0,90)}`;b.onclick=()=>{deckId=s.deck;page=s.page;fillDecks();render();window.scrollTo({top:0,behavior:'smooth'})};box.appendChild(b)})}
function render(){fillDecks();fillTopics();let s=currentSlide();if(!s)return;$('pdfTitle').textContent=s.deckTitle;$('pageBadge').textContent=`${s.page} / ${s.total}`;$('pdf').src=`${D.decks.find(d=>d.id===s.deck).file}#page=${s.page}&toolbar=1&navpanes=0`;$('counter').textContent=`${s.page} / ${s.total} 페이지`;$('prev').disabled=s.page===1;$('next').disabled=s.page===s.total;$('deckname').textContent=s.deckTitle;$('slideTitle').textContent=`슬라이드 ${s.page}`;$('topicBadge').textContent=topicMap[s.topic]?.name||'강의 내용';$('explanation').textContent=s.explanation;$('terms').innerHTML='';if(s.terms.length){s.terms.forEach(t=>{let d=document.createElement('div');d.className='term';let b=document.createElement('b');b.textContent=t.term;let span=document.createElement('span');span.textContent=t.meaning;d.append(b,span);$('terms').appendChild(d)})}else $('terms').innerHTML='<p class="hint">이 페이지에서 자동으로 매칭된 주요 용어가 없습니다. 아래 원문 텍스트를 기준으로 확인하세요.</p>';$('relations').innerHTML='';if(s.relations.length)s.relations.forEach(r=>{let d=document.createElement('div');d.className='relation';d.textContent=r;$('relations').appendChild(d)});else $('relations').innerHTML='<p class="hint">이 페이지 텍스트에서 사전에 등록된 특별한 인과관계가 뚜렷하게 잡히지 않았습니다. 원문 문장과 그림의 화살표·조건을 우선 확인하세요.</p>';$('slideText').textContent=s.text||'(추출 가능한 텍스트가 적은 슬라이드입니다. 원본 화면을 확인하세요.)';renderTopicResults()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{group=b.dataset.group;deckId=D.decks.find(d=>group==='All'||d.group===group)?.id||1;page=1;topic='all';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('deck').onchange=e=>{deckId=Number(e.target.value);page=1;render()};$('topicFilter').onchange=e=>{topic=e.target.value;page=1;render()};$('search').oninput=e=>{query=e.target.value;renderTopicResults()};$('prev').onclick=()=>{if(page>1)page--;render()};$('next').onclick=()=>{if(page<currentDeck().count)page++;render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
